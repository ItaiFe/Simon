[platformio]
default_envs = esp32dev
extra_configs = secrets.ini

; First flash over USB:   pio run -e esp32dev -t upload
[env:esp32dev]
platform = espressif32 @ 6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps = fastled/FastLED @ 3.9.16
build_flags =
    '-DWIFI_SSID="${secrets.wifi_ssid}"'
    '-DWIFI_PASSWORD="${secrets.wifi_password}"'
    '-DOTA_PASSWORD="${secrets.ota_password}"'

; Every flash after that, over WiFi:   pio run -e ota -t upload
; (if simon.local doesn't resolve, add:  --upload-port <device IP>)
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = simon.local
upload_flags = --auth=${secrets.ota_password}

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++11
